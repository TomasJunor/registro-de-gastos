[project]
name = "registro-de-gastos"
version = "0.1.0"
description = "Descarga diaria de movimientos (Santander, Visa, Mercado Pago), categorización y registro de ingresos/egresos"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
web = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
gastos = "gastos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gastos*"]
